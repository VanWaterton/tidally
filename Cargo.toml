[package]
name = "tidally"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A slick terminal client for Tidal: search, queue, album art, spectrum visualizer and EQ"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VanWaterton/tidally"
readme = "README.md"
keywords = ["tidal", "music", "tui", "ratatui", "player"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = ["/.github", "/contrib", "/packaging"]

[features]
default = []
# Experimental: builds `tidally-remote`, which plays through a sound server forwarded from an
# SSH client. Not part of releases yet; see docs/remote-audio.md.
remote = []

[[bin]]
name = "tidally"
path = "src/bin/tidally.rs"

[[bin]]
name = "tidally-remote"
path = "src/bin/tidally-remote.rs"
required-features = ["remote"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
open = "5.4.4"
ratatui = { version = "0.30.2", features = ["crossterm"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
